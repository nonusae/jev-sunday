<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>jev-van-gogh — paintings from probabilities</title>
    <link rel="stylesheet" href="./style.css" />
  </head>
  <body>
    <button id="toggle" class="toggle" aria-expanded="false" aria-controls="sidebar" aria-label="Toggle settings">☰</button>
    <aside id="sidebar" hidden>
      <div class="sidebar-heading">
        <h2>Studio</h2>
        <button id="close" aria-label="Close settings">×</button>
      </div>
      <label for="method">Representation</label>
      <select id="method">
        <option value="palette">16-colour palette (Choice)</option>
        <option value="hsl">HSL (Choice + 2 Scores)</option>
        <option value="rgb">Binary RGB (3 Nouls)</option>
        <option value="silhouette">Silhouette (Noul)</option>
      </select>
      <label for="size">Grid size</label>
      <select id="size"></select>
      <p class="hint">
        Each pixel becomes typed Jev questions. The API key lives on the local
        server (<code>TYPESAFE_API_KEY</code>), never in the browser.
      </p>
      <dl id="meta" class="meta" hidden></dl>
    </aside>
    <button id="workingToggle" class="toggle toggle-right" aria-expanded="false" aria-controls="working">Working</button>
    <aside id="working" class="working" hidden aria-label="Jev's working">
      <div class="sidebar-heading">
        <h2>Jev’s working</h2>
        <button id="closeWorking" aria-label="Close working panel">×</button>
      </div>
      <div id="workingBody"></div>
    </aside>
    <main>
      <section id="carousel" aria-label="Paintings">
        <div id="track">
          <div class="art-card active blank"><div class="canvas-bottom"></div></div>
        </div>
      </section>
      <nav id="navigation" aria-label="Painting carousel" hidden>
        <button id="previous" aria-label="Previous painting">←</button>
        <span id="position"></span>
        <button id="next" aria-label="Next painting">→</button>
      </nav>
      <div class="composer">
        <form id="promptForm" class="prompt-bar">
          <label class="sr-only" for="prompt">Prompt</label>
          <textarea id="prompt" rows="2" maxlength="2000" placeholder="A painting of…" required></textarea>
          <button id="generate" type="submit" aria-label="Generate painting">
            <span>Paint</span>
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.3" aria-hidden="true"><path d="M4 12h15M13 5l7 7-7 7"/></svg>
          </button>
        </form>
        <p id="status" role="status" aria-live="polite"></p>
      </div>
    </main>
    <script type="module" src="./app.mjs"></script>
  </body>
</html>
